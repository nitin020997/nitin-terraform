name: Infracost Cost Estimation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    name: Cost Impact Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Base cost (prod)
        run: infracost breakdown --path base/environments/prod --format json --out-file /tmp/base.json

      - name: PR cost (prod)
        run: infracost breakdown --path environments/prod --format json --out-file /tmp/pr.json

      - name: Diff
        run: infracost diff --path /tmp/pr.json --compare-to /tmp/base.json --format json --out-file /tmp/diff.json

      # Fail PR if monthly cost increase > $500
      - name: Enforce cost threshold
        run: |
          DELTA=$(cat /tmp/diff.json | jq '.diffTotalMonthlyCost | tonumber')
          echo "Monthly cost delta: \$$DELTA"
          if (( $(echo "$DELTA > 500" | bc -l) )); then
            echo "ERROR: Cost increase \$$DELTA exceeds \$500/month threshold. Requires manual approval."
            exit 1
          fi

      - uses: infracost/actions/comment@v3
        with:
          path: /tmp/diff.json
          behavior: update
