name: Terraform Apply

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Required for OIDC authentication to AWS

jobs:
  apply-dev:
    name: Apply Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CICD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Assume Dev Deploy Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.DEV_ACCOUNT_ID }}:role/TerraformDeployRole
          aws-region: us-east-1
          role-chaining: true # Chain from the OIDC role above

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/dev
        run: terraform apply -auto-approve

  apply-staging:
    name: Apply Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: apply-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CICD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Assume Staging Deploy Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.STAGING_ACCOUNT_ID }}:role/TerraformDeployRole
          aws-region: us-east-1
          role-chaining: true
          role-external-id: nitin-terraform-staging

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: environments/staging
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/staging
        run: terraform apply -auto-approve

  apply-prod:
    name: Apply Prod
    runs-on: ubuntu-latest
    environment: prod
    needs: apply-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check change window
        run: |
          HOUR=$(date -u +%H)
          DAY=$(date -u +%u)
          if [ "$DAY" -gt 5 ] || [ "$HOUR" -lt 9 ] || [ "$HOUR" -ge 17 ]; then
            echo "ERROR: Prod deployments only allowed Mon-Fri 09:00-17:00 UTC"
            exit 1
          fi

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CICD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Assume Prod Deploy Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PROD_ACCOUNT_ID }}:role/TerraformDeployRole
          aws-region: us-east-1
          role-chaining: true
          role-external-id: nitin-terraform-prod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/prod
        run: terraform apply -auto-approve
